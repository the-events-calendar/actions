group:
  # Active Plugin Repositories
  - files:
      # Base Files
      - source: templates/.browserslistrc
        dest: .browserslistrc
      - source: templates/.nvmrc
        dest: .nvmrc
      - source: templates/.editorconfig
        dest: .editorconfig
      - source: templates/license.txt
        dest: license.txt
      - source: templates/.eslintignore
        dest: .eslintignore
      - source: templates/.stylelintrc.json
        dest: .stylelintrc.json
      - source: templates/.gitattributes
        dest: .gitattributes

      # GitHub Folder
      - source: templates/pull_request_template.md
        dest: .github/pull_request_template.md

      # Agent guidance. AGENTS.md is the file; CLAUDE.md is a symlink to it.
      - source: templates/AGENTS.md
        dest: AGENTS.md
      - source: templates/CLAUDE.md
        dest: CLAUDE.md

      # Changelog Folder
      - source: templates/changelog/.gitkeep
        dest: changelog/.gitkeep

      # Binary Folder
      - source: templates/bin/check-changelog.sh
        dest: bin/check-changelog.sh
      - source: templates/bin/process-changelog.sh
        dest: bin/process-changelog.sh
      - source: templates/bin/tec-changelog-versioning.js
        dest: bin/tec-changelog-versioning.js

      # GitHub Workflows
      - source: templates/workflows/release-process-changelog.yml
        dest: .github/workflows/release-process-changelog.yml
      - source: templates/workflows/release-prepare-branch.yml
        dest: .github/workflows/release-prepare-branch.yml
      - source: templates/workflows/release-sync-translations.yml
        dest: .github/workflows/release-sync-translations.yml
      - source: templates/workflows/release-merge-forward.yml
        dest: .github/workflows/release-merge-forward.yml
      - source: templates/workflows/release-replace-tbd-entries.yml
        dest: .github/workflows/release-replace-tbd-entries.yml
      - source: templates/workflows/lint.yml
        dest: .github/workflows/lint.yml
      - source: templates/workflows/link-project.yml
        dest: .github/workflows/link-project.yml
      - source: templates/workflows/phpcs.yml
        dest: .github/workflows/phpcs.yml
      - source: templates/workflows/changelogger.yml
        dest: .github/workflows/changelogger.yml
      - source: templates/workflows/release-update-wp-version.yml
        dest: .github/workflows/release-update-wp-version.yml
    repos: |
      the-events-calendar/tribe-common@main
      the-events-calendar/the-events-calendar@main
      the-events-calendar/events-pro@main
      the-events-calendar/events-eventbrite@main
      the-events-calendar/events-community@main
      the-events-calendar/events-filterbar@main
      the-events-calendar/event-tickets@main
      the-events-calendar/event-tickets-plus@main

  # Promoter
  - files:
      - source: templates/pull_request_template.md
        dest: .github/pull_request_template.md
      - source: templates/workflows/link-project.yml
        dest: .github/workflows/link-project.yml
    repos: |
      the-events-calendar/promoter@server/production

  # OpenSpec plan check — every active product, whatever its stack.
  # Planning is the one thing a plugin, a library and a service all share, so this
  # group is deliberately narrow: one workflow, nothing stack-specific. The groups
  # above stay the place for plugin and Promoter specific files.
  - files:
      - source: templates/workflows/openspec-plan.yml
        dest: .github/workflows/openspec-plan.yml
    repos: |
      the-events-calendar/tribe-common@main
      the-events-calendar/the-events-calendar@main
      the-events-calendar/events-pro@main
      the-events-calendar/events-eventbrite@main
      the-events-calendar/events-community@main
      the-events-calendar/events-filterbar@main
      the-events-calendar/event-tickets@main
      the-events-calendar/event-tickets-plus@main
      the-events-calendar/advanced-post-manager@main
      the-events-calendar/event-tickets-plus-app@master
      the-events-calendar/event-tickets-seating-service@main
      the-events-calendar/event-tickets-seating-service-auth@main
      the-events-calendar/promoter-auth-connector@main
      the-events-calendar/promoter@server/production
      the-events-calendar/whodat@server/production
      the-events-calendar/event-aggregator-site@server/production
