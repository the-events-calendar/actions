name: 'Verify OpenSpec Plan'
description: 'Verifies that the pull request has a plan in the shared OpenSpec store, and that the plan is still active.'

inputs:
  github-token:
    description: 'Token with read access to the plans repository.'
    required: true
  plans-repo:
    description: 'Repository holding the shared OpenSpec store.'
    required: false
    default: 'the-events-calendar/plans'
  ticket-id:
    description: 'Ticket id to look for. Derived from the branch name, then the PR title, when empty.'
    required: false
    default: ''
  enforcement:
    description: 'warn (annotate and pass) or block (fail the check).'
    required: false
    default: 'warn'

outputs:
  ticket_id:
    description: 'The ticket id that was looked up, empty when none was found.'
    value: ${{ steps.resolve.outputs.ticket_id }}
  plan_found:
    description: 'Whether an active plan was found (true/false).'
    value: ${{ steps.verify.outputs.plan_found }}

runs:
  using: "composite"
  steps:
    # ------------------------------------------------------------------------------
    # Work out which ticket this pull request belongs to.
    #
    # Branch names follow {type}/{task-id}/{short-desc}, so the branch is the most
    # reliable source. The title is a fallback. Both are author controlled, so they
    # are passed through the environment and never interpolated into the script.
    # ------------------------------------------------------------------------------
    - name: Resolve the ticket id
      id: resolve
      shell: bash
      env:
        HEAD_REF: ${{ github.head_ref }}
        PR_TITLE: ${{ github.event.pull_request.title }}
        TICKET_INPUT: ${{ inputs.ticket-id }}
      run: |
        ticket="$TICKET_INPUT"
        [ -z "$ticket" ] && ticket=$(printf '%s' "$HEAD_REF" | grep -oE '[A-Z][A-Z0-9]+-[0-9]+' | head -1 || true)
        [ -z "$ticket" ] && ticket=$(printf '%s' "$PR_TITLE"  | grep -oE '[A-Z][A-Z0-9]+-[0-9]+' | head -1 || true)
        echo "ticket_id=$ticket" >> "$GITHUB_OUTPUT"

    # ------------------------------------------------------------------------------
    # Look the plan up in the store. The contents API is enough to tell an active
    # change from an archived one, so there is no need to clone the plans repo.
    # ------------------------------------------------------------------------------
    - name: Verify the plan exists
      id: verify
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PLANS_REPO: ${{ inputs.plans-repo }}
        TICKET: ${{ steps.resolve.outputs.ticket_id }}
        ENFORCEMENT: ${{ inputs.enforcement }}
      run: |
        set -uo pipefail

        summary() { echo "$1" >> "$GITHUB_STEP_SUMMARY"; }

        howto() {
          summary ""
          summary "### How to fix this"
          summary ""
          summary '```bash'
          summary "openspec new change ${TICKET:-<TICKET-ID>} --store tec-plans --description \"<what this does>\""
          summary '```'
          summary ""
          summary "Then commit and push it in the [plans repo](https://github.com/${PLANS_REPO})."
          summary "No store registered yet? The \`openspec\` skill walks through it:"
          summary "<https://github.com/stellarwp/skills>"
        }

        if [ -z "$TICKET" ]; then
          echo "::notice title=OpenSpec::No ticket id in the branch name or PR title, skipping the plan check."
          summary "## OpenSpec plan: skipped"
          summary ""
          summary "No ticket id found in the branch name or the PR title, so there is nothing to look up."
          summary "Branches carrying a ticket look like \`feat/SOFT-1234/short-desc\`."
          echo "plan_found=skipped" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        active_path="openspec/changes/${TICKET}"
        archive_path="openspec/changes/archive/${TICKET}"

        if gh api "repos/${PLANS_REPO}/contents/${active_path}" --silent 2>/dev/null; then
          echo "::notice title=OpenSpec::Plan ${TICKET} found in ${PLANS_REPO}."
          summary "## OpenSpec plan: found"
          summary ""
          summary "[\`${TICKET}\`](https://github.com/${PLANS_REPO}/tree/HEAD/${active_path}) is active in the store."
          summary ""
          summary "Before merging, confirm the plan still describes what this PR actually does."
          summary "When the work has landed in **every** repository it touches, archive it once:"
          summary '```bash'
          summary "openspec archive ${TICKET} --store tec-plans"
          summary '```'
          echo "plan_found=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if gh api "repos/${PLANS_REPO}/contents/${archive_path}" --silent 2>/dev/null; then
          echo "::warning title=OpenSpec::Plan ${TICKET} is already archived while this PR is still open."
          summary "## OpenSpec plan: archived early"
          summary ""
          summary "\`${TICKET}\` exists but has already been archived, while this pull request is still open."
          summary "A change spanning several repositories is archived once, after the last of them merges."
          summary "Archiving earlier folds specs into main that describe a state which does not exist yet."
          echo "plan_found=archived" >> "$GITHUB_OUTPUT"
          [ "$ENFORCEMENT" = "block" ] && exit 1
          exit 0
        fi

        echo "::warning title=OpenSpec::No plan found for ${TICKET} in ${PLANS_REPO}."
        summary "## OpenSpec plan: missing"
        summary ""
        summary "No change named \`${TICKET}\` exists in [\`${PLANS_REPO}\`](https://github.com/${PLANS_REPO})."
        summary "Work on TEC products is planned before it is written."
        howto
        echo "plan_found=false" >> "$GITHUB_OUTPUT"
        if [ "$ENFORCEMENT" = "block" ]; then
          exit 1
        fi
        exit 0
