name: 🪴 Generate POT File
description: Generate a POT file from the plugin source code

inputs:
  plugin_path:
    description: 'The path to the plugin source code. Used to search for files to translate.'
    required: true
  pot_path:
    description: 'The path to the POT file to sync'
    required: true

runs:
  using: "composite"
  steps:
    - name: Generate POT file
      shell: bash
      run: |
        curl -O https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
        chmod +x wp-cli.phar
        mv wp-cli.phar /usr/local/bin/wp
        # Submodules are excluded as well as .distignore: common has its own text domain and its
        # own POT, and a checkout with submodules, such as Release: Prep's, would fold its strings in.
        excludes=$( { cat .distignore 2>/dev/null || true; git config --file .gitmodules --get-regexp '\.path$' 2>/dev/null | awk '{print $2}' || true; } | paste -sd, - )
        php -d xdebug.mode=off "$(which wp)" i18n make-pot ${{ inputs.plugin_path }} ${{ inputs.pot_path }} \
        --skip-audit \
        --headers='{"Report-Msgid-Bugs-To":"https://evnt.is/191x","Last-Translator":"","Language-Team":"","PO-Revision-Date":""}' \
        --exclude="$excludes"