name: 🪴 Generate POT File
description: Generate a POT file from the plugin source code

inputs:
  plugin_path:
    description: 'The plugin folder: the checkout, or plugins/<slug> in the monorepo. Its strings are extracted, and its .distignore, submodules and symlinked directories are skipped.'
    required: true
  pot_path:
    description: 'The path to the POT file to sync'
    required: true

runs:
  using: "composite"
  steps:
    - name: Install wp-cli
      shell: bash
      run: |
        # A release with its checksum, not the builds branch's HEAD: the phar runs before the
        # bot token is used in Release: Prep. Bump both lines together.
        curl -fsSL -o wp-cli.phar https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar
        echo "be928f6b8ca1e8dfb9d2f4b75a13aa4aee0896f8a9a0a1c45cd5d2c98605e6172e6d014dda2e27f88c98befc16c040cbb2bd1bfa121510ea5cdf5f6a30fe8832  wp-cli.phar" | sha512sum -c -
        chmod +x wp-cli.phar
        mv wp-cli.phar /usr/local/bin/wp

    # generate-pot.sh documents what is skipped; tests/test-generate-pot.py tests it.
    - name: Generate POT file
      shell: bash
      env:
        PLUGIN_PATH: ${{ inputs.plugin_path }}
        POT_PATH: ${{ inputs.pot_path }}
      run: bash "$GITHUB_ACTION_PATH/generate-pot.sh"
