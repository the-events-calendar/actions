name: "Release prep"
description: "Bumps the version, replaces the TBDs and writes the changelog, then commits it to the release branch"

# A thin wrapper so the product repos call our actions repo, as they do for the other release
# steps, while the work happens in the toolbox's release-prep action. Its README documents the
# inputs and what it refuses.
#
# Pinned to a commit of the toolbox's main, never the branch itself: the bot token is handed to
# this code, and a branch can change under us. Bump the SHA to pick up new commits.

inputs:
  branch:
    description: "The release branch to commit the preparation to, e.g. release/T24.centaur. The checkout has to be on it."
    required: true
  version:
    description: "The version to prepare, e.g. 6.18.3 or 6.18.2.1"
    required: true
  date:
    description: "The changelog date as YYYY-MM-DD. Empty or 'today' writes today, in UTC"
    required: false
    default: ""
  token:
    description: "Token the commit is created with. Needs contents: write on the repository"
    required: true

outputs:
  version:
    description: "The version prepared"
    value: ${{ steps.prep.outputs.version }}
  date:
    description: "The date written in the changelog"
    value: ${{ steps.prep.outputs.date }}
  commit:
    description: "The commit created on the branch. Empty when nothing changed"
    value: ${{ steps.prep.outputs.commit }}
  files:
    description: "The files the commit changed, one per line"
    value: ${{ steps.prep.outputs.files }}

runs:
  using: composite
  steps:
    - name: "Prepare the release branch"
      id: prep
      uses: stellarwp/plugin-toolbox/.github/actions/release-prep@cf4fb51f0114341c7cf509d58e802adadb5fdf15 # main
      with:
        branch: ${{ inputs.branch }}
        version: ${{ inputs.version }}
        date: ${{ inputs.date }}
        token: ${{ inputs.token }}
        # A release, not 'latest': the phar runs on the checkout, so it is pinned like the action.
        pup-version: "2.0.0"
