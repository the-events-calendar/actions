name: Add a new Changelog entry (npm)
description: Writes a change file directly for @stellarwp/changelogger

inputs:
  file:
    description: 'Filename (without extension)'
    default: "action-generated"
    required: true
  significance:
    description: 'Changelog Significance'
    default: 'patch'
    required: true
    # patch
    # minor
    # major
  type:
    description: 'Changelog Type'
    required: true
    # feature
    # tweak
    # fix
    # performance
    # security
    # accessibility
    # compatibility
    # deprecated
    # language
  entry:
    description: 'Changelog Entry'
    required: true

runs:
  using: "composite"
  steps:
    # @stellarwp/changelogger's `add` command has no --filename option (only --auto-filename,
    # which derives the name from the branch, or an interactive prompt) - and this action is
    # called with a specific, meaningful filename. Writing the change file directly matches the
    # tool's own ChangeFile schema (significance/type/entry) without depending on the CLI at all.
    - name: Create a changelog entry file
      id: run-changelogger
      shell: bash
      env:
        CL_FILE: ${{ inputs.file }}
        CL_SIGNIFICANCE: ${{ inputs.significance }}
        CL_TYPE: ${{ inputs.type }}
        CL_ENTRY: ${{ inputs.entry }}
      run: |
        mkdir -p changelog
        node -e '
          const fs = require("fs");
          const path = require("path");
          const file = process.env.CL_FILE;
          const significance = process.env.CL_SIGNIFICANCE;
          const type = process.env.CL_TYPE;
          const entry = process.env.CL_ENTRY;
          const yamlEscape = (s) => `"${String(s).replace(/\\/g, "\\\\").replace(/"/g, "\\\"").replace(/\n/g, "\\n")}"`;
          const content = `significance: ${significance}\ntype: ${type}\nentry: ${yamlEscape(entry)}\n`;
          fs.writeFileSync(path.join("changelog", `${file}.yaml`), content);
        '
