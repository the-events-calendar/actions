name: "Release merge"
description: "Merges the release branch into the base branch, then the base branch back into develop"

# Merges through the GitHub API, in merge.sh, which documents what it refuses. Not the toolbox's
# release-merge: that one checks every .puprc version file against the version, and a four-part
# release keeps package.json on three parts. Here the branch arrives prepared and the version only
# names the tag.

inputs:
  branch:
    description: "The release branch to merge, e.g. release/T24.centaur"
    required: true
  head:
    description: "The commit the branch has to be at, as a full hash. Empty checks nothing"
    required: false
    default: ""
  version:
    description: "The version being released, e.g. 6.18.3 or 6.18.2.1. It names the tag; no file is checked against it"
    required: true
  base-branch:
    description: "The branch the release is merged into"
    required: false
    default: "main"
  develop-branch:
    description: "The branch the base is merged back into. Empty by default: we work with release branches, so nothing is merged back"
    required: false
    default: ""
  token:
    description: "Token the merges are made with. Needs contents: write on the repository"
    required: true

outputs:
  version:
    description: "The version released"
    value: ${{ steps.merge.outputs.version }}
  branch:
    description: "The release branch merged"
    value: ${{ steps.merge.outputs.branch }}
  base-sha:
    description: "The commit on the base branch that holds the release. Build from it and publish at it"
    value: ${{ steps.merge.outputs.base-sha }}

runs:
  using: composite
  steps:
    - name: "Merge the release"
      id: merge
      shell: bash
      env:
        # Read from the environment, never interpolated into the script.
        GH_TOKEN: ${{ inputs.token }}
        BRANCH: ${{ inputs.branch }}
        HEAD: ${{ inputs.head }}
        VERSION: ${{ inputs.version }}
        BASE: ${{ inputs.base-branch }}
        DEVELOP: ${{ inputs.develop-branch }}
      run: bash "$GITHUB_ACTION_PATH/merge.sh"
