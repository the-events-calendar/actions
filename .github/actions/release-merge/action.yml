name: "Release merge"
description: "Merges the release branch into the base branch, then the base branch back into develop"

# A thin wrapper so the product repos call our actions repo, while the work happens in the toolbox's
# release-merge action. Its README documents the inputs and what it refuses.
#
# Pinned to a commit of the toolbox's main, never the branch itself: the bot token is handed to
# this code, and a branch can change under us. Bump the SHA to pick up new commits.

inputs:
  branch:
    description: "The release branch to merge, e.g. release/T24.centaur"
    required: true
  head:
    description: "The commit the branch has to be at, as a full hash. Empty checks nothing"
    required: false
    default: ""
  version:
    description: "The version being released, e.g. 6.18.3 or 6.18.2.1. Every .puprc version file must hold it"
    required: true
  base-branch:
    description: "The branch the release is merged into"
    required: false
    default: "main"
  develop-branch:
    description: "The branch the base is merged back into. Empty by default: we work with release branches, so nothing is merged back"
    required: false
    default: ""
  token:
    description: "Token the merges are made with. Needs contents: write on the repository"
    required: true

outputs:
  version:
    description: "The version released"
    value: ${{ steps.merge.outputs.version }}
  branch:
    description: "The release branch merged"
    value: ${{ steps.merge.outputs.branch }}
  base-sha:
    description: "The commit on the base branch that holds the release. Build from it and publish at it"
    value: ${{ steps.merge.outputs.base-sha }}

runs:
  using: composite
  steps:
    - name: "Merge the release"
      id: merge
      uses: stellarwp/plugin-toolbox/.github/actions/release-merge@184de04ef58e876aa02ee8d62b22fe8324f87f68 # main
      with:
        branch: ${{ inputs.branch }}
        head: ${{ inputs.head }}
        version: ${{ inputs.version }}
        base-branch: ${{ inputs.base-branch }}
        develop-branch: ${{ inputs.develop-branch }}
        token: ${{ inputs.token }}
