name: 'Check workflow templates'

# ------------------------------------------------------------------------------
# Templates here are copied verbatim into every product repo, so a mistake reaches
# a dozen repos before a human sees it.
#
# The templates are not workflows of this repository, so they are staged into a
# .github/workflows path before linting.
#
# shellcheck is off: the templates carry a few dozen SC2086/SC2129 style hits.
# Turn it back on once those are cleaned up.
# ------------------------------------------------------------------------------

on:
  pull_request:
    paths:
      - 'templates/workflows/**'
      - '.github/sync.yml'
      - '.github/workflows/**'
      - '.github/actionlint.yaml'
      - '.github/actions/verify-openspec-plan/**'
      - 'tests/**'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7
        with:
          # The repo is bind-mounted into the actionlint container, and nothing here
          # needs git credentials.
          persist-credentials: false

      - name: Stage the templates where actionlint expects workflows
        run: |
          mkdir -p .actionlint/.github/workflows
          cp templates/workflows/*.yml .actionlint/.github/workflows/

      - name: Run actionlint
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 \
            -color -shellcheck= -config-file .github/actionlint.yaml \
            .actionlint/.github/workflows/*.yml .github/workflows/*.yml

      # repo-file-sync-action copies with fs-extra, which refuses to copy a symlink
      # over an identical symlink. The first sync of one succeeds and every later
      # run fails for the whole repository group, so no synced source may be a link.
      - name: Check that no synced source is a symlink
        run: |
          status=0
          while read -r src; do
            if [ -L "$src" ]; then
              echo "::error file=.github/sync.yml::${src} is a symlink and cannot be synced. Seed links by hand in the target repos instead."
              status=1
            fi
          done < <(grep -oE '^\s*- source: \S+' .github/sync.yml | awk '{print $3}')
          exit $status

      - name: Check the WordPress version arithmetic
        run: python3 tests/test-wp-version-math.py

      - name: Check the "Tested up to" guard
        run: python3 tests/test-tested-up-to.py

      - name: Set up Node for OpenSpec regression tests
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install the pinned OpenSpec validator
        run: |
          npm install --prefix "$RUNNER_TEMP/tec-openspec-cli" --ignore-scripts --no-audit --no-fund @fission-ai/openspec@1.12.0
          echo "$RUNNER_TEMP/tec-openspec-cli/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Check OpenSpec plan enforcement
        run: python3 tests/test-openspec-plan.py
